[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradebot"
version = "0.1.0"
description = "Crypto market scanner, signal generator and trading bot with a self-learning ML filter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ccxt>=4.3",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
tradebot = "tradebot.cli:main"

[tool.setuptools.packages.find]
include = ["tradebot*"]

[tool.setuptools.package-data]
"tradebot.gates" = ["golden.json", "data/*.csv.gz"]  # the same-trades check's fixed dataset and golden orders

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# ruff's long-standing default rule set, pinned so every ruff version lints the same way
# (the deploy gate runs `python -m ruff check tradebot tests`)
select = ["E4", "E7", "E9", "F"]
